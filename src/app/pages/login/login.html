<section class="min-h-screen bg-light text-dark flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 focus-ring rounded" aria-label="Inicio">
        <svg class="h-8 w-8 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path
            d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205 3 1m-3-1-3-1.091m0 0-3 1.091m0 0-3-1.091m9-3.273-3 1.091L9 7.5l3-1.091m0 0 3 1.091"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <h1 class="text-2xl font-bold font-display text-dark">Alojamientos Quindío</h1>
      </a>

      <nav class="hidden md:flex items-center gap-6" aria-label="Principal">
        <a routerLink="/explorar" class="nav-link">Explorar</a>
        <a routerLink="/experiencias" class="nav-link">Experiencias</a>
        <a routerLink="/ser-anfitrion" class="nav-link">Ser Anfitrión</a>
      </nav>

      <div class="hidden md:flex items-center gap-4">
        <button
          type="button"
          [routerLink]="['/landing-page']"
          class="text-sm text-green-500 border btn-primary border-green-500 rounded-full px-3 py-1 hover:bg-green-500 hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
          aria-label="Ir a landing page"

        >
          principal
        </button>

      </div>

      <button type="button" class="md:hidden icon-btn" aria-label="Abrir menú">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <section class="w-full max-w-md space-y-8 bg-white p-8 sm:p-10 rounded-xl shadow-lg">
      <header class="text-center">
        <h2 class="mt-2 text-3xl sm:text-4xl font-bold font-display text-dark">¡Bienvenido de nuevo!</h2>
        <p class="mt-2 text-base text-accent font-accent">Inicia sesión para continuar tu aventura en el Quindío.</p>
      </header>

      <!-- Formulario de inicio de sesión -->
      <form class="mt-6 space-y-6" (ngSubmit)="onSubmit()" aria-labelledby="login-title" justify-center>
        <h3 id="login-title" class="sr-only">Formulario de inicio de sesión</h3>

        <div class="space-y-4">
          <!-- Email -->
          <div>
            <label for="email-address" class="sr-only">Correo electrónico</label>
            <input
              id="email-address"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="Correo electrónico"
              required
              class="input-base rounded-t-lg"
              [(ngModel)]="email"
            />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="sr-only">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Contraseña"
              required
              class="input-base rounded-b-lg"
              [(ngModel)]="password"
            />
          </div>
        </div>

        <!--  Olvidaste tu contraseña -->
        <div class="flex items-center justify-between">

          <button
            type="button"
            [routerLink]="['/restore-password']"
            class="text-sm text-green-500 border border-green-500 rounded-full px-3 py-1 hover:bg-green-500 hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
            aria-label="Ir a recuperar contraseña"

          >
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <!-- Botón de envío -->
        <button type="submit" class="btn-primary w-full" aria-label="Iniciar sesión" (click)="goToMyAccountGuest()">
          Iniciar Sesión como huesped
        </button>

        <button type="submit" class="btn-primary w-full" aria-label="Iniciar sesión" (click)="goToMyAccountHost()">
          Iniciar Sesión como host
        </button>
      </form>

      <p class="text-center text-sm font-accent text-accent">
        ¿No tienes una cuenta?
        <button
          type="button"
          [routerLink]="['/register']"
          class="text-sm text-green-500 border border-green-500 rounded-full px-3 py-1 hover:bg-green-500 hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
          aria-label="Ir a registrarse"

        >
          Registrate
        </button>
      </p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white mt-auto">
    <div class="mx-auto max-w-7xl px-6 py-4 text-center text-accent font-accent text-sm">
      <p>© 2025 Alojamientos Quindío.</p>
    </div>
  </footer>
</section>
