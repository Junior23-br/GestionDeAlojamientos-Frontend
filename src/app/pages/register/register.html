<div
  class="relative flex min-h-screen w-full flex-col lg:flex-row bg-white overflow-x-hidden font-['Plus_Jakarta_Sans','Noto_Sans',sans-serif]"
>
  <!-- Columna izquierda (formulario) -->
  <div
    class="flex flex-1 items-center justify-center py-10 lg:py-16 bg-white"
  >
    <div class="w-full max-w-md md:max-w-lg space-y-8 px-6 lg:px-12">
      <div class="text-center lg:text-left">
        <div class="flex items-center justify-center lg:justify-start gap-4 text-[#111714]">
          <div class="size-8">
            <svg
              class="text-[#1ed275]"
              fill="none"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                clip-rule="evenodd"
                d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z"
                fill="currentColor"
                fill-rule="evenodd"
              ></path>
              <path
                clip-rule="evenodd"
                d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z"
                fill="currentColor"
                fill-rule="evenodd"
              ></path>
            </svg>
          </div>
          <h1
            class="text-3xl font-bold leading-tight tracking-[-0.015em]"
          >
            El Rincón del Viajero
          </h1>
        </div>
        <h2
          class="mt-4 text-2xl font-bold tracking-tight text-gray-900"
        >
          Crea tu cuenta
        </h2>
        <p class="mt-2 text-sm text-gray-600">
          ¿Ya tienes una cuenta?
          <a
            routerLink="/login"
            class="font-medium text-[#1ed275] hover:text-[#17a85e]"
          >Inicia sesión</a
          >
        </p>
      </div>

      <!-- Formulario -->
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <label class="block text-sm font-medium text-gray-700">
            <span>Nombre</span>
            <input
              [(ngModel)]="nombre"
              name="nombre"
              required
              class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              placeholder="Tu nombre completo"
            />
          </label>

          <label class="block text-sm font-medium text-gray-700">
            <span>Email</span>
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              required
              class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              placeholder="tu@email.com"
            />
          </label>

          <label class="block text-sm font-medium text-gray-700">
            <span>Contraseña</span>
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              required
              class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              placeholder="Mínimo 8 caracteres"
            />
          </label>

          <label class="block text-sm font-medium text-gray-700">
            <span>Teléfono</span>
            <input
              [(ngModel)]="telefono"
              name="telefono"
              type="tel"
              class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              placeholder="+57 300 123 4567"
            />
          </label>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <label class="block text-sm font-medium text-gray-700">
              <span>Rol</span>
              <select
                [(ngModel)]="rol"
                name="rol"
                class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              >
                <option value="usuario">Usuario</option>
                <option value="anfitrion">Anfitrión</option>
              </select>
            </label>

            <label class="block text-sm font-medium text-gray-700">
              <span>Fecha de nacimiento</span>
              <input
                [(ngModel)]="fechaNacimiento"
                name="fechaNacimiento"
                type="date"
                class="mt-1 block w-full rounded-lg border-gray-300 bg-gray-50 p-3.5 text-base text-gray-900 shadow-sm focus:border-[#1ed275] focus:ring-[#1ed275]"
              />
            </label>
          </div>
        </div>

        <div class="space-y-4">
          <label class="flex items-start text-sm text-gray-700">
            <input
              type="checkbox"
              [(ngModel)]="aceptaPolitica"
              name="aceptaPolitica"
              class="h-4 w-4 rounded border-gray-300 text-[#1ed275] focus:ring-[#1ed275]"
            />
            <span class="ml-3"
            >Acepto la
              <a href="#" class="text-[#1ed275] hover:text-[#17a85e]"
              >política de tratamiento de datos</a
              ></span
            >
          </label>

          <label class="flex items-start text-sm text-gray-700">
            <input
              type="checkbox"
              [(ngModel)]="aceptaTerminos"
              name="aceptaTerminos"
              class="h-4 w-4 rounded border-gray-300 text-[#1ed275] focus:ring-[#1ed275]"
            />
            <span class="ml-3"
            >Acepto los
              <a href="#" class="text-[#1ed275] hover:text-[#17a85e]"
              >términos y condiciones</a
              ></span
            >
          </label>

          <label class="flex items-start text-sm text-gray-700">
            <input
              type="checkbox"
              [(ngModel)]="recibeNotificaciones"
              name="recibeNotificaciones"
              class="h-4 w-4 rounded border-gray-300 text-[#1ed275] focus:ring-[#1ed275]"
            />
            <span class="ml-3"
            >Doy mi consentimiento para recibir notificaciones</span
            >
          </label>

          <label class="flex items-start text-sm text-gray-700">
            <input
              type="checkbox"
              [(ngModel)]="tambienAnfitrion"
              name="tambienAnfitrion"
              class="h-4 w-4 rounded border-gray-300 text-[#1ed275] focus:ring-[#1ed275]"
            />
            <span class="ml-3">Quiero ser anfitrión también</span>
          </label>
        </div>

        <button
          type="submit"
          class="flex w-full justify-center rounded-lg bg-[#1ed275] px-5 py-3.5 text-base font-bold text-black shadow-lg transition hover:bg-[#17a85e] focus:outline-none focus:ring-2 focus:ring-[#1ed275] focus:ring-offset-2"
        >
          Crear cuenta
        </button>
      </form>

      <div class="mt-6 text-center text-sm">
        <a
          routerLink="/"
          class="font-medium text-gray-600 hover:text-gray-900"
        >Regresar a la página principal</a
        >
        <span class="mx-2 text-gray-400">|</span>
        <a href="#" class="font-medium text-gray-600 hover:text-gray-900"
        >Centro de ayuda</a
        >
        <span class="mx-2 text-gray-400">|</span>
        <a href="#" class="font-medium text-gray-600 hover:text-gray-900"
        >Quiénes somos</a
        >
      </div>
    </div>
  </div>

  <!-- Columna derecha (imagen o banner) -->
  <div
    class="hidden lg:flex flex-1 bg-[#1ed275] items-center justify-center relative"
  >
    <div class="text-white max-w-md text-center p-10">
      <h3 class="text-3xl font-bold mb-4">
        Descubre el mundo con nosotros
      </h3>
      <p class="text-lg opacity-90">
        Únete a nuestra comunidad de viajeros, comparte experiencias y vive
        aventuras únicas en cada rincón del planeta.
      </p>
    </div>
  </div>
</div>
