<main class="min-h-screen bg-brand-alice text-brand-charcoal flex items-center justify-center p-6 md:p-12">
  <section class="w-full max-w-md">
    <!-- Título y subtítulo -->
    <header class="mb-8 text-center">
      <h1 class="font-display text-3xl sm:text-4xl font-bold">Restablecer Contraseña</h1>
      <p class="font-accent text-lg sm:text-xl text-brand-mauve mt-2">Recupera el acceso a tu cuenta.</p>
    </header>

    <!-- Formulario -->
    <form class="w-full space-y-6" (submit)="$event.preventDefault()" aria-labelledby="reset-title">
      <h2 id="reset-title" class="sr-only">Formulario para restablecer contraseña</h2>

      <!-- Correo -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium">Correo electrónico</label>
        <div class="relative">
          <input
            id="email"
            type="email"
            placeholder="    tucorreo@ejemplo.com"
            class="input-base pl-10"
            autocomplete="email"
            required
          />
          <span class="input-icon">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>

      <button type="button" class="btn-primary w-full" aria-label="Enviar código de restablecimiento">
        Enviar código de restablecimiento
      </button>

      <!-- Sección código + nueva contraseña -->
      <div class="pt-4 border-t border-brand-powder space-y-4" aria-live="polite">
        <!-- Código -->
        <div class="space-y-2">
          <label for="reset-code" class="block text-sm font-medium">Código de restablecimiento</label>
          <div class="relative">
            <input
              id="reset-code"
              type="text"
              placeholder="    Introduce el código"
              class="input-base pl-10"
              disabled
              aria-disabled="true"
            />
            <span class="input-icon">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Nueva contraseña -->
        <div class="space-y-2">
          <label for="new-password" class="block text-sm font-medium">Nueva contraseña</label>
          <div class="relative">
            <input
              id="new-password"
              type="password"
              placeholder="   Tu nueva contraseña"
              class="input-base pl-10"
              disabled
              aria-disabled="true"
              autocomplete="new-password"
            />
            <span class="input-icon">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.629 5.629l-2.371 2.37a1 1 0 01-1.414 0l-4.243-4.243a1 1 0 010-1.414l2.37-2.371A6 6 0 0115 7z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary w-full opacity-50 cursor-not-allowed" disabled aria-disabled="true">
        Restablecer contraseña
      </button>
    </form>

    <!-- Enlace inferior -->
    <div class="mt-8 w-full text-center">
      <p class="text-sm">
        ¿Recordaste tu contraseña?
        <a routerLink="/login" class="font-bold text-brand-green hover:underline font-accent focus-ring rounded" aria-label="Ir a iniciar sesión">
          Iniciar sesión
        </a>
      </p>
    </div>
  </section>
</main>
